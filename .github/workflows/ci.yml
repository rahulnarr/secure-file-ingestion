name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_call: # allows deploy.yml to depend on this workflow passing first

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage (>=80% required)
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: coverage/
          retention-days: 14

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signed_file_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/signed_file_api_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The `services.postgres.options` healthcheck only gates when the
      # container is scheduled; it doesn't guarantee the port is reachable
      # from *this* job's steps yet. This step is the actual, visible proof
      # the database is reachable before any test tries to use it.
      - name: Check Postgres connectivity
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          for i in $(seq 1 10); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres is reachable"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/10)"
            sleep 2
          done
          echo "Postgres did not become reachable in time" >&2
          exit 1

      - name: Integration tests
        run: npm run test:integration
