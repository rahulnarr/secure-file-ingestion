name: Deploy

# Runs the full test suite (via ci.yml), verifies the target infrastructure
# is actually reachable, and only then deploys to the DigitalOcean Droplet.
# See infra/README.md for the one-time server setup this depends on, and
# the repository secrets it requires.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  verify-droplet:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Droplet's SSH port is reachable
        run: |
          for i in $(seq 1 10); do
            if nc -z -w 5 "${{ secrets.DROPLET_HOST }}" 22; then
              echo "Droplet is up and accepting SSH connections"
              exit 0
            fi
            echo "Waiting for the Droplet... ($i/10)"
            sleep 5
          done
          echo "Droplet did not become reachable in time" >&2
          exit 1

  verify-database:
    needs: verify-droplet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The Managed Postgres firewall only allows connections from the
      # Droplet itself, so this check runs *from* the Droplet over SSH
      # rather than directly from the runner — a separate, visible step
      # from the actual deploy that follows.
      - name: Check Postgres connectivity from the Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            PGCONNECT_TIMEOUT=10 psql "${{ secrets.DATABASE_URL }}" -c "select 1" >/dev/null
            echo "Postgres is reachable from the Droplet"

  deploy:
    needs: [test, verify-droplet, verify-database]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render production .env
        run: |
          cat > .env.deploy <<EOF
          PORT=3847
          HOST=127.0.0.1
          BASE_URL=${{ secrets.BASE_URL }}
          SIGNING_SECRET=${{ secrets.SIGNING_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA_BASE64=${{ secrets.DATABASE_SSL_CA_BASE64 }}
          DATA_DIR=/opt/signed-file-api/data
          UPLOAD_DIR=/opt/signed-file-api/data/uploads
          MAX_UPLOAD_BYTES=26214400
          MAX_BATCH_SIZE=20
          MAX_TTL_SECONDS=86400
          LOG_LEVEL=info
          RETRY_MAX_ATTEMPTS=4
          RETRY_BASE_DELAY_MS=100
          RETRY_MAX_DELAY_MS=2000
          RETRY_MAX_ELAPSED_MS=10000
          EOF

      - name: Upload .env to the Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: ".env.deploy"
          target: "/opt/signed-file-api"

      - name: Pull, build, and restart the service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/signed-file-api
            mv .env.deploy .env
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            sudo systemctl restart signed-file-api
            sleep 2
            curl -sf http://127.0.0.1:3847/health

      - name: Verify the public endpoint is healthy
        run: curl -sf "${{ secrets.BASE_URL }}/health"
